<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orefy · Take control of your cloud</title>
<link rel="icon" href="assets/orefy-favicon.svg">
<link rel="stylesheet" href="_ds/orefy-design-system-e8d10855-3b90-4dc9-aff0-c6948544598a/tokens/fonts.css">
<link rel="stylesheet" href="_ds/orefy-design-system-e8d10855-3b90-4dc9-aff0-c6948544598a/tokens/colors.css">
<link rel="stylesheet" href="_ds/orefy-design-system-e8d10855-3b90-4dc9-aff0-c6948544598a/tokens/typography.css">
<link rel="stylesheet" href="_ds/orefy-design-system-e8d10855-3b90-4dc9-aff0-c6948544598a/tokens/spacing.css">
<link rel="stylesheet" href="_ds/orefy-design-system-e8d10855-3b90-4dc9-aff0-c6948544598a/tokens/effects.css">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>:root{--font-sans:'Inter',ui-sans-serif,system-ui,sans-serif;--font-display:'Inter',ui-sans-serif,system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}body{font-variant-numeric:tabular-nums}</style>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--bg-app);color:var(--text-body);font-family:var(--font-sans);font-size:var(--fs-body);line-height:var(--lh-normal);letter-spacing:var(--ls-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%}
img{max-width:100%;height:auto}
section[id],header[id]{scroll-margin-top:80px}
a{color:var(--accent-text);text-decoration:none}a:hover{color:var(--ore-600);text-decoration:underline}
.wrap{max-width:var(--content-max);margin:0 auto;padding:0 32px;width:100%}
.mono{font-family:var(--font-sans)}
.over{font-size:var(--fs-overline);font-weight:700;letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--accent-text)}
h1,h2,h3{margin:0;color:var(--text-strong);text-wrap:balance}
p{margin:0;text-wrap:pretty}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #1D2026}
.nav .wrap{display:flex;align-items:center;gap:32px;height:64px}
.nav img{height:26px;display:block;width:auto}
.nav-links{display:flex;gap:24px;margin-left:8px}
.nav-links a{color:var(--slate-300);font-size:14px;font-weight:500;padding:8px 0;transition:color .2s}
.nav-links a:hover{color:#fff;text-decoration:none}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:16px;flex-shrink:0}
.lang-switch{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.05);border:1px solid #1D2026;border-radius:var(--radius-pill);padding:2px 4px}
.lang-switch button{all:unset;cursor:pointer;padding:3px 7px;border-radius:var(--radius-pill);color:var(--slate-400);transition:all .2s;font-size:11px;font-weight:700;letter-spacing:.04em;line-height:1}
.lang-switch button:hover{color:#fff}
.lang-switch button.on{background:var(--ore-500);color:#fff}
.lang-sep{color:var(--slate-600);font-size:10px;padding:0 1px;pointer-events:none}

/* hero */
.hero{background:#08090B;position:relative;overflow:hidden;padding:88px 0 0}
.strata{position:absolute;inset:0;pointer-events:none}
.strata i{position:absolute;left:0;right:0;height:1px;background:#1D2026}
.strata i b{position:absolute;top:0;height:1px;background:var(--ore-500);opacity:.7}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(36px,5.8vw,76px);font-weight:800;letter-spacing:var(--ls-display);line-height:1.05;color:var(--slate-50)}
.hero h1 em{font-style:normal;color:var(--ore-300)}
.hero .lede{margin-top:24px;font-size:20px;line-height:1.5;color:var(--slate-300);max-width:32ch}
.hero .lede strong{color:var(--slate-50);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;align-items:center}
.hero-note{font-size:13px;color:var(--slate-400)}
.hero-foot{position:relative;margin-top:80px;border-top:1px solid #1D2026}
.hero-foot .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.hero-foot a{display:flex;flex-direction:column;gap:6px;padding:22px 20px 26px 0;color:var(--slate-300);font-size:14px;font-weight:600;border-right:1px solid #1D2026;margin-right:20px;transition:color .2s}
.hero-foot a:last-child{border-right:0;margin-right:0}
.hero-foot a span{font-family:var(--font-sans);font-size:12px;color:var(--ore-400);font-weight:500}
.hero-foot a:hover{color:#fff;text-decoration:none}

/* console mock */
.console{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:var(--radius-xl);box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.02);overflow:hidden;font-size:13px;max-width:100%}
.console-bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-bottom:1px solid var(--slate-800);color:var(--slate-400);font-size:12px}
.console-bar .dots{display:flex;gap:6px}.console-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--slate-700)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.split>div{padding:16px;min-width:0}
.split>div+div{border-left:1px solid var(--slate-800);background:#111317}
.col-h{font-size:11px;font-weight:700;letter-spacing:var(--ls-overline);text-transform:uppercase;color:var(--slate-500);margin-bottom:12px;display:flex;justify-content:space-between}
.res{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);color:var(--slate-300);font-family:var(--font-sans);font-size:12px;transition:background .28s var(--ease-out),color .28s}
.res .k{width:6px;height:6px;border-radius:50%;background:var(--slate-600);flex:none;transition:background .28s}
.res .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .t{color:var(--slate-500);font-size:11px}
.res.on{background:rgba(207,138,50,.12);color:var(--ore-200)}.res.on .k{background:var(--ore-400)}
.res.done .k{background:var(--green-600)}
.code{font-family:var(--font-mono);font-size:12px;line-height:1.75;color:var(--slate-300);white-space:pre;overflow-x:auto;-webkit-overflow-scrolling:touch}
.code .c{color:var(--slate-500)}.code .s{color:var(--ore-300)}.code .kw{color:#9DB8D6}.code .a{color:var(--slate-100)}
.tree{font-family:var(--font-mono);font-size:12px;color:var(--slate-400);line-height:1.8;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--slate-800);overflow-x:auto;white-space:nowrap}
.tree .cur{color:var(--ore-300)}
.console-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--slate-800);font-size:12px;color:var(--slate-400)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--slate-800);overflow:hidden}.bar i{display:block;height:100%;background:var(--ore-500);transition:width .5s var(--ease-out)}

/* sections */
section.block{padding:120px 0}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:end;margin-bottom:56px}
.sec-head h2{font-size:clamp(30px,4vw,48px);font-weight:800;letter-spacing:var(--ls-display);line-height:1.1;margin-top:14px}
.sec-head p{font-size:var(--fs-body-lg);color:var(--text-muted);max-width:44ch}

/* pipeline */
.pipe{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:40px;align-items:start}
.steps{display:flex;flex-direction:column;border-top:1px solid var(--border-default)}
.step{all:unset;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;padding:20px 4px;border-bottom:1px solid var(--border-default);position:relative;box-sizing:border-box}
.step .num{font-family:var(--font-sans);font-size:13px;color:var(--text-subtle);padding-top:3px}
.step h3{font-size:var(--fs-h4);font-weight:700;letter-spacing:var(--ls-heading);color:var(--text-muted);transition:color .2s}
.step p{grid-column:2;font-size:14px;color:var(--text-muted);display:none;line-height:1.5}
.step .prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
.step.on h3{color:var(--text-strong)}.step.on .num{color:var(--accent-text)}.step.on p{display:block}
.step.on .prog{animation:prog 7s linear forwards}
.step:hover h3{color:var(--text-strong)}
.step:focus-visible{box-shadow:var(--shadow-focus)}
@keyframes prog{to{width:100%}}
.panel{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);overflow:hidden;min-height:440px;display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border-subtle);font-size:13px;color:var(--text-muted);flex-wrap:wrap}
.panel-h strong{color:var(--text-strong);font-weight:700}
.panel-b{padding:20px;flex:1;animation:fade .28s var(--ease-out);min-width:0;overflow-x:hidden}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
.stats div{background:var(--surface-card);padding:14px 16px}
.stats b{display:block;font-size:24px;font-weight:800;letter-spacing:var(--ls-heading);color:var(--text-strong)}
.stats span{font-size:12px;color:var(--text-muted)}

/* table */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px;border-radius:var(--radius-sm)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
table.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle);padding:0 10px 10px;border-bottom:1px solid var(--border-default);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--border-subtle);color:var(--text-body);vertical-align:middle}
table.t td.mono{font-size:12px;color:var(--text-strong);white-space:nowrap}

/* screenshots */
.shots{border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px;background:var(--surface-sunken,var(--slate-50))}
.shots-h{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border-subtle);font-size:12px;font-weight:600;color:var(--text-muted);flex-wrap:wrap}
.shots-tabs{display:flex;gap:4px;margin-left:auto}
.shots-tabs button{all:unset;cursor:pointer;padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-muted);transition:all .2s}
.shots-tabs button.on{background:var(--surface-card);color:var(--text-strong);box-shadow:var(--shadow-sm)}
.shot-stage{display:grid;background:#fff}
.shot{grid-area:1/1;position:relative;opacity:0;transition:opacity .28s var(--ease-out);align-self:start}
.shot.on{opacity:1}
.shot img{display:block;width:100%;height:auto}
.mask{position:absolute;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);background:rgba(255,255,255,.35);border-radius:2px}

/* code panels */
.code-l{background:var(--slate-950);border-radius:var(--radius-lg);padding:16px 18px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.two{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.ftree{font-family:var(--font-mono);font-size:12px;line-height:2;color:var(--text-muted)}
.ftree .cur{color:var(--accent-text);font-weight:600}

/* verify panel */
.verify{display:flex;flex-direction:column;gap:16px}
.ok{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--green-100);background:#F3FAF6;border-radius:var(--radius-lg)}
.ok svg{flex:none;color:var(--success)}
.ok b{color:var(--success-text);display:block;font-size:15px}
.ok span{font-size:13px;color:var(--text-muted)}
.diffrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px 70px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.diffrow .mono{font-size:12px;color:var(--text-strong)}
.match{color:var(--success-text);font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}

/* scan panel */
.fw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.finding{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-subtle);font-size:14px}
.finding b{color:var(--text-strong);font-weight:600;display:block}
.finding small{color:var(--text-muted);font-size:12px}
.finding .ctl{font-family:var(--font-sans);font-size:11px;color:var(--text-subtle)}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar{width:80px;flex:none;background:var(--slate-100)}

/* sovereign */
.sov{background:var(--slate-950);color:var(--slate-300);position:relative;overflow:hidden}
.sov h2{color:var(--slate-50)}
.sov .sec-head p{color:var(--slate-400)}
.sov .over{color:var(--ore-300)}
.sov-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#1D2026;border:1px solid #1D2026;border-radius:var(--radius-xl);overflow:hidden}
.sov-grid div{background:var(--slate-950);padding:28px 28px 32px}
.sov-grid .mono{font-size:12px;color:var(--ore-400)}
.sov-grid h3{color:var(--slate-50);font-size:var(--fs-h4);font-weight:700;letter-spacing:var(--ls-heading);margin:14px 0 8px}
.sov-grid p{font-size:14px;color:var(--slate-400)}

/* cta */
.cta{padding:120px 0;background:var(--slate-950);border-top:1px solid #1D2026}
.cta h2{color:var(--slate-50);font-size:clamp(34px,4.6vw,56px);font-weight:800;letter-spacing:var(--ls-display);line-height:1.05}
.cta h2 em{font-style:normal;color:var(--ore-300)}
.cta .over{color:var(--ore-300)}
.cta p.sub{margin-top:16px;font-size:var(--fs-body-lg);color:var(--slate-300)!important}
.cta .form{background:var(--slate-900);border-color:var(--slate-800)}
.cta-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:56px;align-items:center}
.form{display:flex;flex-direction:column;gap:14px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:24px;min-width:0}
.form .row{display:flex;gap:10px;align-items:flex-end}
.form .row>*:first-child{flex:1}
.done{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text-body)}
.done svg{color:var(--success);flex:none;margin-top:2px}

/* footer */
footer{padding:40px 0 56px;font-size:13px;color:var(--slate-400);background:var(--slate-950);border-top:1px solid #1D2026}
footer .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
footer img{height:22px;display:block;width:auto}
footer .links{display:flex;gap:20px;margin-left:auto}
footer .links a{color:var(--slate-400);transition:color .2s}
footer .links a:hover{color:var(--slate-50)}

/* ====================================================
   RESPONSIVE BREAKPOINTS
   ==================================================== */

/* Tablet & Smaller Laptops */
@media (max-width:1024px){
  .wrap{padding:0 28px}
  .hero-grid{gap:40px}
  .pipe{gap:32px}
  .sec-head{gap:32px}
}

/* Tablet Portrait & Small Screens */
@media (max-width:960px){
  section.block,.cta{padding:84px 0}
  .hero{padding:64px 0 0}
  .hero-grid,.pipe,.sec-head,.cta-box{grid-template-columns:minmax(0,1fr)}
  .hero-grid{gap:44px}
  .sec-head{gap:16px;margin-bottom:40px}
  .hero-foot{margin-top:56px}
  .hero-foot .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-foot a{border-right:0;margin-right:0;padding:16px 12px 16px 0;border-bottom:1px solid #1D2026}
  .hero-foot a:nth-last-child(-n+2){border-bottom:0}
  .sov-grid{grid-template-columns:minmax(0,1fr)}
  .nav-links{display:none}
  .two{grid-template-columns:minmax(0,1fr);gap:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Large Mobile / Phablets */
@media (max-width:680px){
  .nav .wrap{gap:14px;height:56px}
  .nav img{height:22px}
  .nav-badge{display:none!important}
  .nav-r{gap:10px}
  section[id],header[id]{scroll-margin-top:60px}
  .split{grid-template-columns:minmax(0,1fr)}
  .split>div+div{border-left:0;border-top:1px solid var(--slate-800)}
  .diffrow{grid-template-columns:minmax(0,1fr) 76px}
  .diffrow>:nth-child(2),.diffrow>:nth-child(3){display:none}
  .diffrow .match{justify-self:end}
  .finding{grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start}
  .finding .ctl{grid-column:2;font-size:11px}
  footer{padding:36px 0 44px}
  footer .wrap{flex-direction:column;align-items:flex-start;gap:16px}
  footer .links{margin-left:0;gap:18px;flex-wrap:wrap}
}

/* Standard Mobile & Small Phones (320px - 480px) */
@media (max-width:480px){
  .wrap{padding:0 16px}
  section.block,.cta{padding:52px 0}
  .hero{padding:36px 0 0}
  .hero h1{font-size:clamp(28px,8.5vw,40px);line-height:1.1}
  .hero .lede{font-size:16px;margin-top:16px;line-height:1.5}
  .cta-row{flex-direction:column;align-items:stretch;gap:10px;margin-top:28px}
  .cta-row>a,.cta-row button{width:100%;justify-content:center;text-align:center}
  .hero-foot{margin-top:36px}
  .hero-foot .wrap{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hero-foot a{padding:12px 10px;margin:0;border:1px solid #1D2026;border-radius:var(--radius-md);background:rgba(255,255,255,.02)}
  .sec-head h2{font-size:clamp(24px,7vw,34px);line-height:1.15}
  .sec-head p{font-size:15px}
  .step{padding:14px 4px;grid-template-columns:28px minmax(0,1fr);gap:2px 10px}
  .step h3{font-size:15px}
  .step p{font-size:13px;margin-top:4px}
  .panel{min-height:auto;border-radius:var(--radius-lg)}
  .panel-h{padding:12px 14px;gap:8px;font-size:12px}
  .panel-b{padding:14px}
  .stats{margin-bottom:14px}
  .stats div{padding:10px 12px}
  .stats b{font-size:19px}
  .stats span{font-size:11px}
  .code-l{padding:12px 14px}
  .code{font-size:11px;line-height:1.6}
  .ok{padding:12px;gap:10px}
  .ok b{font-size:14px}
  .ok span{font-size:12px}
  .cta h2{font-size:clamp(26px,7.5vw,38px)}
  .form{padding:20px 16px;border-radius:var(--radius-lg);gap:12px}
  .form-btn-link,.form button{width:100%;justify-content:center;text-align:center}
  table.t th,table.t td{padding:9px 8px;font-size:12px}
}

/* Modal overlay for Imprint & Privacy */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s var(--ease-out)}
.modal-dialog{background:var(--slate-900);border:1px solid var(--slate-800);border-radius:var(--radius-xl);box-shadow:0 24px 64px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05);width:100%;max-width:760px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--slate-800);background:var(--slate-950)}
.modal-header h2{font-size:18px;font-weight:700;color:var(--slate-50);letter-spacing:var(--ls-heading);margin:0}
.modal-close{all:unset;cursor:pointer;width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--slate-400);transition:all .2s;font-size:18px;line-height:1}
.modal-close:hover{background:var(--slate-800);color:#fff}
.modal-body{padding:24px;overflow-y:auto;color:var(--slate-300);font-size:14px;line-height:1.7}
.modal-body h3{font-size:16px;color:var(--slate-100);margin:22px 0 8px;font-weight:700}
.modal-body h3:first-child{margin-top:0}
.modal-body p{margin-bottom:14px;color:var(--slate-300);line-height:1.7}
.modal-body ul{margin:0 0 14px 20px;padding:0}
.modal-body li{margin-bottom:6px}
